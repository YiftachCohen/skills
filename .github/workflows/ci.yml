name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python3 -m unittest discover atlas/tests -v
      - name: Examples validate
        run: |
          python3 atlas/scripts/render.py atlas/examples/demo.json --check --strict
          python3 atlas/scripts/render.py atlas/examples/demo-v1.json --check
      - name: Render is well-formed
        run: python3 atlas/scripts/render.py atlas/examples/demo.json -o /tmp/out.html
      - name: Viewer JS syntax
        run: node --check atlas/templates/viewer.js
      - name: Shell scripts parse
        run: for f in */scripts/*.sh; do bash -n "$f"; done
      - name: Skill descriptions fit the 1024-char limit
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for f in sorted(glob.glob("*/SKILL.md")):
              fm = open(f).read().split("---")[1]
              m = re.search(r"^description:\s*(?:[|>][-+]?\s*\n((?:[ \t]+.*\n?)+)|(.*))", fm, re.M)
              d = " ".join((m.group(1) or m.group(2) or "").split()) if m else ""
              print(f"{f}: {len(d)}")
              if not d or len(d) > 1024:
                  bad.append(f)
          sys.exit(f"description missing or over 1024 chars: {bad}" if bad else 0)
          PY
